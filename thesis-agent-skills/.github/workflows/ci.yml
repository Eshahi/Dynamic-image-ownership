name: Offline thesis contracts
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'skills/**', 'spec-kit/**', 'tests/**', 'installers/**', 'pyproject.toml']
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements-tested.txt -r requirements-spec-kit.txt -e .
      - name: Run isolated offline fixtures
        run: python tools/run_validation.py
